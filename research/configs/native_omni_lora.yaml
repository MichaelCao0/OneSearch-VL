# Materialized only by native_sft config after retained train rows + CPU audit.
# The command inserts pinned local model/dataset/output paths; this is not launchable alone.
stage: sft
do_train: true
finetuning_type: lora
template: qwen2_omni
train_on_prompt: false
mask_history: false
packing: false
neat_packing: false
cutoff_len: 32768
video_fps: 2.0
video_min_pixels: 3136
video_max_pixels: 100352
video_maxlen: 128
image_min_pixels: 3136
image_max_pixels: 262144
audio_sampling_rate: 16000
use_audio_in_video: true
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.00002
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
flash_attn: disabled
logging_steps: 1
save_steps: 50
save_total_limit: 2
report_to: none
overwrite_output_dir: false
overwrite_cache: false
preprocessing_num_workers: 1
dataloader_num_workers: 0
ddp_find_unused_parameters: false
