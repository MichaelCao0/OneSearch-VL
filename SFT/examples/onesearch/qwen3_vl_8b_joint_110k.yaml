# Joint supervised fine-tuning for video and image agent trajectories.
# Joint SFT: 8 nodes x 8 GPUs gives global batch 128.
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
video_max_pixels: 100352
video_maxlen: 128
video_fps: 2
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: examples/deepspeed/ds_z2_config.json
dataset: video_agent_sft,multi_image_agent_sft,image_agent_sft
dataset_dir: data
template: qwen3_vl
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 1
preprocessing_batch_size: 16
tokenized_path: cache/onesearch-sft-110k
dataloader_num_workers: 4
output_dir: saves/onesearch-sft-110k
logging_steps: 5
save_steps: 500
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
gradient_checkpointing: true
learning_rate: 1.0e-05
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 600
