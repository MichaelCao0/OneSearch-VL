[workspace]
name = "onesearch-av-sft-gpu"
version = "0.1.0"
description = "Isolated CUDA controller LoRA SFT and native label audit"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
ffmpeg = ">=7,<8"
sqlite = "==3.53.4"

[pypi-options]
index-url = "https://pypi.org/simple"

[pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.8.0%2Bcu126-cp311-cp311-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download.pytorch.org/whl/cu126/torchvision-0.23.0%2Bcu126-cp311-cp311-manylinux_2_28_x86_64.whl" }
torchaudio = { url = "https://download.pytorch.org/whl/cu126/torchaudio-2.8.0%2Bcu126-cp311-cp311-manylinux_2_28_x86_64.whl" }
transformers = "==4.57.6"
datasets = "==4.0.0"
accelerate = "==1.11.0"
peft = "==0.18.1"
trl = "==0.24.0"
torchdata = { url = "https://files.pythonhosted.org/packages/95/d4/af694ef718aedbe95a72760ab9ff7a6a7a44ace2d7f70c27bfeb67c5c503/torchdata-0.11.0-py3-none-any.whl" }
av = "==16.0.1"
qwen-omni-utils = { version = "==0.0.9", extras = ["decord"] }
librosa = "==0.11.0"
soundfile = "==0.13.1"
decord = "==0.6.0"
pillow = "==11.3.0"
numpy = "==2.2.6"
pandas = "==2.3.3"
einops = "==0.8.1"
omegaconf = "==2.3.0"
packaging = "==25.0"
pyyaml = "==6.0.3"
pydantic = "==2.12.3"
sentencepiece = "==0.2.1"
tiktoken = "==0.12.0"
scipy = "==1.16.2"
protobuf = "==6.33.0"

[tasks]
label-audit = "env PYTHONPATH=../../SFT/src:../.. python -m research.av_train.label_audit"

native-sft = "env PYTHONPATH=../../SFT/src:../.. python -m research.av_train.native_sft"
